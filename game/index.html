<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightshade: Velvet Hour - a top-down stealth game</title>
<style>
  html, body { margin: 0; padding: 0; background: #05060c; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh;
         font-family: system-ui, sans-serif; }
  #wrap { text-align: center; }
  canvas { width: min(98vw, 1280px); height: auto; aspect-ratio: 16 / 9;
           background: #0b0d16; border: 1px solid #2a2f42; border-radius: 8px;
           box-shadow: 0 18px 60px rgba(0,0,0,0.65); display: block; }
  p.hint { color: #69707f; font-size: 12px; margin: 8px 0 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <p class="hint">Nightshade: Velvet Hour - WASD move · SHIFT sneak · Q coin toss · F smoke bomb · P pause · R restart · M mute</p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
